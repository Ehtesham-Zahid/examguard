services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: examify
      POSTGRES_PASSWORD: examify
      POSTGRES_DB: examify
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://examify:examify@db:5432/examify
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a long random string}
      CLIENT_ORIGIN: http://localhost:4000
      PUBLIC_WEB_URL: http://localhost:4000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMAIL_RELAY_URL: ${EMAIL_RELAY_URL:-}
      EMAIL_RELAY_SECRET: ${EMAIL_RELAY_SECRET:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports: ["4000:4000"]
volumes:
  pgdata:
