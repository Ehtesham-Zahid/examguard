services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: examguard
      POSTGRES_PASSWORD: examguard
      POSTGRES_DB: examguard
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql://examguard:examguard@db:5432/examguard
      JWT_SECRET: change-me-to-a-long-random-string-in-production
      CLIENT_ORIGIN: http://localhost:4000
      PUBLIC_WEB_URL: http://localhost:4000
    ports: ["4000:4000"]
volumes:
  pgdata:
