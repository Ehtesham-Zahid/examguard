# One-click Render Blueprint: free Postgres + one web service serving API, WebSockets and the React app
databases:
  - name: examguard-db
    plan: free
    databaseName: examguard
services:
  - type: web
    name: examguard
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@12.15.0 install --frozen-lockfile --prod=false && npx --yes pnpm@12.15.0 --filter web build && npx --yes pnpm@12.15.0 --filter api build
    startCommand: cd apps/api && npx prisma db push --skip-generate && (test "$SEED_ON_START" = "true" && SEED_IF_EMPTY=true npx tsx prisma/seed.ts || true) && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: examguard-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "true"
      # Email. Render's free plan blocks SMTP, so use the Google Apps Script relay (apps/api/scripts/google-apps-script/SETUP.md):
      # fill EMAIL_RELAY_URL + EMAIL_RELAY_SECRET in the dashboard. (SMTP_* only work on plans/hosts that allow SMTP.)
      # Until one is set, emails are recorded in Admin → Email log but not delivered.
      - key: EMAIL_RELAY_URL
        sync: false
      - key: EMAIL_RELAY_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: EMAIL_TIMEZONE
        value: Asia/Karachi
      # AI marking assistant: paste a Claude API key in the dashboard (Environment → ANTHROPIC_API_KEY). Off until set.
      - key: ANTHROPIC_API_KEY
        sync: false
